<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Shade Generator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
/* Layout: header · stacked color entries (picker, prefix, ramp) · export card */
:root {
  --bg:     #f8f9fb;
  --bg2:    #ffffff;
  --bg3:    #f1f2f6;
  --fg:     #0f1623;
  --fg2:    #374151;
  --fg3:    #6b7280;
  --fg4:    #98a0af;
  --border: #e3e6ed;
  --accent: #2563eb;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:     #0d1017;
    --bg2:    #141922;
    --bg3:    #1c2333;
    --fg:     #edf0f7;
    --fg2:    #b8c0d4;
    --fg3:    #5d6882;
    --fg4:    #6b7691;
    --border: #1e2a3e;
    --accent: #4f80f7;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:     #0d1017;
  --bg2:    #141922;
  --bg3:    #1c2333;
  --fg:     #edf0f7;
  --fg2:    #b8c0d4;
  --fg3:    #5d6882;
  --fg4:    #6b7691;
  --border: #1e2a3e;
  --accent: #4f80f7;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  padding-block: 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.app {
  max-width: 920px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
  min-width: 0;
}

/* Header */
.header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.header h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.02em;
}
.badge {
  font-size: 11px;
  font-weight: 500;
  color: var(--fg4);
  background: var(--bg3);
  border: 1px solid var(--border);
  padding: 2px 9px;
  border-radius: 20px;
  letter-spacing: 0.04em;
}

/* Entries (one per color) */
#entries { display: flex; flex-direction: column; gap: 14px; }

.entry {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}

.entry-controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: flex-end;
}

.field { display: flex; flex-direction: column; gap: 6px; }

.field-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg4);
}

.color-row {
  display: flex;
  align-items: stretch;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  overflow: hidden;
  height: 42px;
  transition: border-color 0.15s;
}
.color-row:focus-within,
.prefix-input:focus,
.hex-text:focus { border-color: var(--accent); outline: none; }

input[type="color"] {
  width: 48px;
  height: 100%;
  border: none;
  outline: none;
  padding: 5px 6px;
  background: none;
  cursor: pointer;
  border-right: 1px solid var(--border);
  display: block;
}
input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
input[type="color"]::-webkit-color-swatch { border-radius: 4px; border: none; }

.hex-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  background: none;
  border: none;
  outline: none;
  color: var(--fg);
  padding: 0 12px;
  width: 108px;
  letter-spacing: 0.04em;
  min-width: 0;
}

.prefix-input {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--fg);
  padding: 0 12px;
  width: 180px;
  max-width: 100%;
  height: 42px;
  letter-spacing: 0.04em;
  transition: border-color 0.15s;
}

.remove-btn {
  height: 42px;
  width: 42px;
  font-size: 18px;
  line-height: 1;
  color: var(--fg3);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: color 0.12s, border-color 0.12s;
}
.remove-btn:hover { color: var(--fg); border-color: var(--fg4); }
.remove-btn:disabled { opacity: 0.4; cursor: default; }

.toggles { display: flex; flex-direction: column; gap: 8px; justify-content: flex-end; padding-bottom: 2px; }
.switch { position: relative; display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg2); cursor: pointer; user-select: none; white-space: nowrap; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.track { position: relative; width: 30px; height: 18px; flex-shrink: 0; border-radius: 18px; background: var(--bg3); border: 1px solid var(--border); transition: background 0.15s, border-color 0.15s; }
.track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--fg4); transition: transform 0.15s, background 0.15s; }
.switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .track::after { transform: translateX(12px); background: #fff; }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

.add-btn {
  align-self: flex-start;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: var(--fg2);
  background: var(--bg2);
  border: 1px dashed var(--fg4);
  border-radius: var(--radius);
  padding: 9px 16px;
  cursor: pointer;
  transition: color 0.12s, border-color 0.12s;
}
.add-btn:hover { color: var(--fg); border-color: var(--accent); }

/* Dark variant card */
.variant-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}
.variant-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.variant-title { font-size: 13px; font-weight: 600; color: var(--fg); }
.variant-sub { font-size: 12px; color: var(--fg3); }
.sliders { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px 24px; }
.sliders.off { opacity: 0.5; }
.slider-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 12px; color: var(--fg2); }
.slider-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--fg);
  font-variant-numeric: tabular-nums;
  padding: 1px 6px;
  border-radius: 4px;
  background: var(--bg3);
  cursor: ew-resize;
  touch-action: none;
  user-select: none;
}
.slider-val:hover { border: 1px solid var(--border); padding: 0 5px; }
.slider-track-wrap { position: relative; }
.slider-center-tick {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 2px;
  height: 10px;
  background: var(--bg2);
  border-radius: 1px;
  pointer-events: none;
  opacity: 0.8;
  z-index: 1;
}
.slider-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--fg4); margin-top: 4px; }
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 22px;
  margin: 0;
  background: transparent;
  cursor: pointer;
  touch-action: pan-x;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 6px;
  border-radius: 6px;
  background:
    linear-gradient(to right, var(--bg3) var(--a, 50%), var(--accent) var(--a, 50%), var(--accent) var(--b, 50%), var(--bg3) var(--b, 50%));
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  margin-top: -7px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid var(--bg2);
  box-shadow: 0 1px 4px rgba(0,0,0,0.30);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
input[type="range"]:hover::-webkit-slider-thumb { box-shadow: 0 1px 6px rgba(0,0,0,0.35); }
input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.2); box-shadow: 0 2px 8px rgba(0,0,0,0.40); }
input[type="range"]::-moz-range-track { height: 6px; border-radius: 6px; background: var(--bg3); }
input[type="range"]::-moz-range-progress { height: 6px; border-radius: 6px; background: var(--accent); }
input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg2); box-shadow: 0 1px 4px rgba(0,0,0,0.30); }
input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

/* Ramp */
.ramp-wrap {
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
}
.ramp { display: flex; height: 120px; }

.ramp-cell {
  flex: 1;
  min-width: 0;
  position: relative;
  cursor: pointer;
  transition: flex 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), transform 100ms ease-out;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.ramp-cell:hover { flex: 1.6; }
.ramp-cell:active { transform: scale(0.98); }

.ramp-label {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 10px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
  opacity: 0;
  transition: opacity 0.15s;
  pointer-events: none;
  white-space: nowrap;
}
.ramp-cell:hover .ramp-label { opacity: 1; }

.ramp-hint {
  font-size: 11px;
  color: var(--fg4);
  margin: 0;
}

.empty {
  font-size: 13px;
  color: var(--fg3);
  padding: 24px;
  text-align: center;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
}

/* Export card */
.code-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.code-tabs {
  display: flex;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
}

.tab-btn {
  font-size: 12px;
  font-weight: 500;
  color: var(--fg4);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 10px 14px 8px;
  cursor: pointer;
  margin-bottom: -1px;
  transition: color 0.12s, border-color 0.12s;
  font-family: 'Inter', sans-serif;
}
.tab-btn:hover { color: var(--fg2); }
.tab-btn.active { color: var(--fg); border-bottom-color: var(--accent); }

.code-toolbar {
  display: flex;
  justify-content: flex-end;
  padding: 7px 10px;
  border-bottom: 1px solid var(--border);
}

.copy-all-btn {
  font-size: 12px;
  font-weight: 500;
  color: var(--fg3);
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 4px 11px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
}
.copy-all-btn:hover { color: var(--fg); }

pre {
  margin: 0;
  padding: 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  line-height: 1.8;
  color: var(--fg2);
  overflow-x: auto;
  min-width: 0;
  max-height: 420px;
}

.add-btn:active,
.copy-all-btn:active,
.remove-btn:active { transform: scale(0.97); transition: transform 100ms ease-out; }

/* Toast */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(70px);
  background: var(--fg);
  color: var(--bg);
  font-size: 12px;
  font-weight: 600;
  padding: 7px 18px;
  border-radius: 20px;
  pointer-events: none;
  transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
  z-index: 999;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

@media (prefers-reduced-motion: reduce) {
  .ramp-cell, .track, .track::after, .add-btn, .copy-all-btn, .remove-btn { transition: none; }
  .ramp-cell:active, .add-btn:active, .copy-all-btn:active, .remove-btn:active { transform: none; }
  .toast { transform: translateX(-50%); opacity: 0; transition: opacity 0.2s ease; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
}
</style>

<div class="app">

      </div>

          <div class="slider-center-tick"></div>

<script>
// ── OKLCH math (Björn Ottosson's Oklab, 2020) ──────────────────────────────
const lin   = c => c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
const unlin = c => c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055;
const clamp01 = v => Math.max(0, Math.min(1, v));

function hexToOklch(hex) {
  const r = lin(parseInt(hex.slice(1,3), 16) / 255);
  const g = lin(parseInt(hex.slice(3,5), 16) / 255);
  const b = lin(parseInt(hex.slice(5,7), 16) / 255);
  const l_ = Math.cbrt(0.4122214708*r + 0.5363325363*g + 0.0514459929*b);
  const m_ = Math.cbrt(0.2119034982*r + 0.6806995451*g + 0.1073969566*b);
  const s_ = Math.cbrt(0.0883024619*r + 0.2817188376*g + 0.6299787005*b);
  const L  = 0.2104542553*l_ + 0.7936177850*m_ - 0.0040720468*s_;
  const a  = 1.9779984951*l_ - 2.4285922050*m_ + 0.4505937099*s_;
  const bb = 0.0259040371*l_ + 0.7827717662*m_ - 0.8086757660*s_;
  const C  = Math.sqrt(a*a + bb*bb);
  const H  = Math.atan2(bb, a) * 180 / Math.PI;
  return [L, C, H < 0 ? H + 360 : H];
}

function oklchToHex(L, C, H) {
  const h  = H * Math.PI / 180;
  const a  = C * Math.cos(h), b = C * Math.sin(h);
  const l_ = L + 0.3963377774*a + 0.2158037573*b;
  const m_ = L - 0.1055613458*a - 0.0638541728*b;
  const s_ = L - 0.0894841775*a - 1.2914855480*b;
  const lx = l_**3, mx = m_**3, sx = s_**3;
  const rr = clamp01(unlin( 4.0767416621*lx - 3.3077115913*mx + 0.2309699292*sx));
  const gg = clamp01(unlin(-1.2684380046*lx + 2.6097574011*mx - 0.3413193965*sx));
  const bv = clamp01(unlin(-0.0041960863*lx - 0.7034186147*mx + 1.7076147010*sx));
  return '#' + [rr, gg, bv].map(v => Math.round(v * 255).toString(16).padStart(2, '0')).join('');
}

// ── Shade stops: [shade, L, C_ratio] ──────────────────────────────────────
// C_ratio is relative to peak chroma (shade 600 = 1.0)
// 25 = midpoint(white, 50): L = (1.000 + 0.971) / 2, Cr = (0 + 0.110) / 2
const STOPS = [
  [ 25,  0.9855, 0.055 ],
  [ 50,  0.971,  0.110 ],
  [100,  0.943,  0.210 ],
  [200,  0.880,  0.400 ],
  [300,  0.797,  0.650 ],
  [400,  0.707,  0.840 ],
  [500,  0.623,  0.950 ],
  [600,  0.546,  1.000 ],
  [700,  0.488,  0.950 ],
  [800,  0.424,  0.780 ],
  [900,  0.379,  0.570 ],
  [950,  0.282,  0.380 ],
];

function generate(hexColor, prefix, opts = {}) {
  if (!/^#[0-9a-fA-F]{6}$/.test(hexColor)) return null;
  const [L, C, H] = hexToOklch(hexColor);

  let best = 0, bestD = Infinity;
  STOPS.forEach(([, sL], i) => { const d = Math.abs(L - sL); if (d < bestD) { bestD = d; best = i; } });
  // Middle mode: pin the base to shade 500 and remap the other lightness stops around it.
  // Otherwise: keep the stop set and snap the nearest stop to the base.
  const pinIdx = STOPS.findIndex(([s]) => s === 500);
  const bestIdx = opts.middle ? pinIdx : best;
  const pinRatio = STOPS[bestIdx][2];
  const peakC = pinRatio > 0 ? C / pinRatio : C;
  const midL = STOPS[pinIdx][1];
  const base = hexColor.toLowerCase();

  return STOPS.map(([shade, shadeL, ratio], i) => {
    let outL = shadeL;
    if (opts.middle && shade < 500) {
      const t = (shadeL - STOPS[0][1]) / (midL - STOPS[0][1]);
      outL = STOPS[0][1] + t * (L - STOPS[0][1]);
    } else if (opts.middle && shade > 500) {
      const t = (midL - shadeL) / (midL - 0.282);
      outL = L - t * (L - 0.282);
    }
    let hex = oklchToHex(outL, peakC * ratio, H);
    if ((opts.include || opts.middle) && i === bestIdx) hex = base;
    let L2 = outL, C2 = peakC * ratio, H2 = H;
    if (opts.dark) {
      hex = toDarkVariant(hex, opts.dark.sat, opts.dark.bright);
      const dv = hexToOklch(hex);
      L2 = dv[0]; C2 = dv[1]; H2 = dv[2];
    }
    return {
      shade,
      name:  `${prefix}-${shade}`,
      hex,
      L: L2, C: C2, H: H2,
    };
  });
}

function relLuminance(hex) {
  const r = lin(parseInt(hex.slice(1,3), 16) / 255);
  const g = lin(parseInt(hex.slice(3,5), 16) / 255);
  const b = lin(parseInt(hex.slice(5,7), 16) / 255);
  return 0.2126*r + 0.7152*g + 0.0722*b;
}
const contrastText = hex => relLuminance(hex) > 0.32 ? '#1a1d2b' : '#f5f7ff';
// WCAG contrast ratio between two hex colors (1 to 21)
function contrastRatio(a, b) {
  const la = relLuminance(a), lb = relLuminance(b);
  return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
}

// ── State: one entry per color ─────────────────────────────────────────────
// Dark variant in OKLCH: saturation scales chroma, brightness scales lightness.
// Values run from -100 (desaturate / darken) through 0 (unchanged) to +100 (saturate / lighten).
const darkState = { on: false, sat: -30, bright: 15 };
function toDarkVariant(hex, sat, bright) { // sat and bright in -1..1
  const [L, C, H] = hexToOklch(hex);
  const L2 = bright < 0 ? L * (1 + bright) : L + (1 - L) * bright;
  return oklchToHex(L2, C * (1 + sat), H);
}
function darkOpts() {
  return darkState.on ? { sat: darkState.sat / 100, bright: darkState.bright / 100 } : null;
}

let uid = 0;
const palettes = [];
let tab = 'css';

function addPalette(hex = '#6366f1', prefix = 'brand') {
  palettes.push({ id: ++uid, hex, prefix });
}
addPalette('#6366f1', 'brand');
addPalette('#10b981', 'accent');

// Valid palettes with generated shades
function allPalettes() {
  return palettes
    .map(p => ({ ...p, shades: generate(p.hex, p.prefix.trim() || 'brand', { include: p.include, middle: p.middle, dark: darkOpts() }) }))
    .filter(p => p.shades);
}

// ── Rendering ──────────────────────────────────────────────────────────────
const entriesEl = document.getElementById('entries');

function buildEntry(p) {
  const el = document.createElement('div');
  el.className = 'entry';
  el.dataset.id = p.id;
  el.innerHTML = `
    <div class="entry-controls">
      <div class="field">
        <span class="field-label">Base Color</span>
        <div class="color-row">
          <input type="color" class="picker" value="${p.hex}" aria-label="Base color">
          <input type="text" class="hex-text" value="${p.hex}" maxlength="7" spellcheck="false" aria-label="Hex value">
        </div>
      </div>
      <div class="field">
        <span class="field-label">Prefix</span>
        <input type="text" class="prefix-input" value="${p.prefix}" placeholder="brand" aria-label="Prefix">
      </div>
      <div class="toggles">
        <label class="switch"><input type="checkbox" class="inc-toggle" ${p.include ? 'checked' : ''}><span class="track"></span><span>Base is one of the shades</span></label>
        <label class="switch"><input type="checkbox" class="mid-toggle" ${p.middle ? 'checked' : ''}><span class="track"></span><span>Base is the middle (500)</span></label>
      </div>
      <button class="remove-btn" title="Remove color" aria-label="Remove color">×</button>
    </div>
    <div class="ramp-wrap"><div class="ramp"></div></div>
    <p class="ramp-hint">Click any shade to copy its hex value</p>
  `;

  el.querySelector('.picker').addEventListener('input', e => {
    p.hex = e.target.value;
    el.querySelector('.hex-text').value = p.hex;
    refresh(el, p);
  });

  el.querySelector('.hex-text').addEventListener('input', e => {
    let v = e.target.value.trim();
    if (!v.startsWith('#')) v = '#' + v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) {
      p.hex = v;
      el.querySelector('.picker').value = v;
      refresh(el, p);
    }
  });

  el.querySelector('.inc-toggle').addEventListener('change', e => {
    p.include = e.target.checked;
    if (!p.include) { p.middle = false; el.querySelector('.mid-toggle').checked = false; }
    refresh(el, p);
  });

  el.querySelector('.mid-toggle').addEventListener('change', e => {
    p.middle = e.target.checked;
    if (p.middle) { p.include = true; el.querySelector('.inc-toggle').checked = true; }
    refresh(el, p);
  });

  el.querySelector('.prefix-input').addEventListener('input', e => {
    p.prefix = e.target.value;
    refresh(el, p);
  });

  el.querySelector('.remove-btn').addEventListener('click', () => {
    const i = palettes.indexOf(p);
    if (i > -1) palettes.splice(i, 1);
    renderEntries();
  });

  return el;
}

function renderRamp(el, p) {
  const ramp = el.querySelector('.ramp');
  const shades = generate(p.hex, p.prefix.trim() || 'brand', { include: p.include, middle: p.middle, dark: darkOpts() });
  ramp.innerHTML = '';
  if (!shades) return;
  shades.forEach(s => {
    const cell = document.createElement('div');
    cell.className = 'ramp-cell';
    cell.style.background = s.hex;
    const cw = contrastRatio(s.hex, '#ffffff');
    const cb = contrastRatio(s.hex, '#000000');
    cell.title = `${s.name} · ${s.hex} · ${cw.toFixed(2)}:1 on white · ${cb.toFixed(2)}:1 on black`;
    cell.innerHTML = `<span class="ramp-label" style="color:${contrastText(s.hex)}"><b>${s.shade}</b><span>${s.hex}</span></span>`;
    cell.addEventListener('click', () => copy(s.hex, `Copied ${s.hex}`));
    ramp.appendChild(cell);
  });
}

function refresh(el, p) {
  renderRamp(el, p);
  renderCode();
}

function renderEntries() {
  entriesEl.innerHTML = '';
  if (palettes.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'No colors yet. Click "+ Add color" to start.';
    entriesEl.appendChild(empty);
  }
  palettes.forEach(p => {
    const el = buildEntry(p);
    entriesEl.appendChild(el);
    renderRamp(el, p);
  });
  document.querySelectorAll('.remove-btn').forEach(b => b.disabled = false);
  renderCode();
}

// ── Export ─────────────────────────────────────────────────────────────────
function renderCode() {
  const out = document.getElementById('codeOut');
  const sets = allPalettes();
  if (sets.length === 0) { out.textContent = '/* Add a color to generate shades */'; return; }

  if (tab === 'css') {
    out.textContent = ':root {\n' + sets.flatMap(p =>
      p.shades.map(s => `  --${s.name}: ${s.hex};`)).join('\n') + '\n}';
  } else if (tab === 'js') {
    out.textContent = sets.map(p => {
      const id = p.prefix.trim().replace(/[^a-zA-Z0-9_$]/g, '_') || 'brand';
      return `export const ${id} = {\n` + p.shades.map(s => `  ${s.shade}: '${s.hex}',`).join('\n') + '\n};';
    }).join('\n\n') + '\n';
  } else if (tab === 'oklch') {
    out.textContent = ':root {\n' + sets.flatMap(p =>
      p.shades.map(s => `  --${s.name}: oklch(${(s.L * 100).toFixed(2)}% ${s.C.toFixed(4)} ${s.H.toFixed(2)});`)
    ).join('\n') + '\n}';
  } else {
    const rows = sets.flatMap(p => p.shades.map(s => `| ${s.name} | ${s.hex} |`)).join('\n');
    out.textContent = `| Name | Value |\n| --- | --- |\n${rows}`;
  }
}

// ── Toast ──────────────────────────────────────────────────────────────────
let toastT;
function copy(text, msg = 'Copied!') {
  navigator.clipboard.writeText(text).catch(() => {
    const el = document.createElement('textarea');
    el.value = text; Object.assign(el.style, { position: 'fixed', opacity: '0' });
    document.body.appendChild(el); el.select();
    document.execCommand('copy'); document.body.removeChild(el);
  });
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1700);
}

// ── Wiring ─────────────────────────────────────────────────────────────────
document.getElementById('addBtn').addEventListener('click', () => {
  const n = palettes.length;
  const hues = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#06b6d4', '#8b5cf6'];
  addPalette(hues[n % hues.length], `color${n + 1}`);
  renderEntries();
  const last = entriesEl.lastElementChild;
  if (last) last.querySelector('.prefix-input').focus();
});

document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  tab = btn.dataset.tab;
  renderCode();
}));

document.getElementById('copyAll').addEventListener('click', () =>
  copy(document.getElementById('codeOut').textContent, 'Copied to clipboard!'));

// ── Dark variant controls ──────────────────────────────────────────────────
function refreshAll() {
  document.querySelectorAll('.entry').forEach(el => {
    const p = palettes.find(x => x.id === Number(el.dataset.id));
    if (p) renderRamp(el, p);
  });
  renderCode();
}

function setSlider(key, val) {
  darkState[key] = Math.max(-100, Math.min(100, Math.round(val)));
  const v = darkState[key];
  const input = document.getElementById(key === 'sat' ? 'satRange' : 'brightRange');
  input.value = v;
  // Fill from the center (0) out to the thumb
  const pct = (v + 100) / 2;
  input.style.setProperty('--a', Math.min(50, pct) + '%');
  input.style.setProperty('--b', Math.max(50, pct) + '%');
  document.querySelector(`[data-key="${key}"]`).textContent = (v > 0 ? '+' : '') + v + '%';
}

function applyDarkMode() {
  // Sliders stay visible; they only change the shades while dark mode is on
  document.getElementById('darkSliders').classList.toggle('off', !darkState.on);
  document.documentElement.setAttribute('data-theme', darkState.on ? 'dark' : 'light');
  refreshAll();
}

// The dark mode toggle also switches the overall page theme
document.getElementById('darkToggle').addEventListener('change', e => {
  darkState.on = e.target.checked;
  applyDarkMode();
});

[['sat', 'satRange'], ['bright', 'brightRange']].forEach(([key, id]) => {
  const input = document.getElementById(id);
  input.addEventListener('input', () => { setSlider(key, Number(input.value)); refreshAll(); });

  // Scrub: drag the percentage sideways to change it (0.5 per px)
  const readout = document.querySelector(`[data-key="${key}"]`);
  let startX = 0, startVal = 0;
  readout.addEventListener('pointerdown', e => {
    startX = e.clientX; startVal = darkState[key];
    readout.setPointerCapture(e.pointerId);
  });
  readout.addEventListener('pointermove', e => {
    if (!readout.hasPointerCapture(e.pointerId)) return;
    setSlider(key, startVal + (e.clientX - startX) * 0.5);
    refreshAll();
  });
  readout.addEventListener('pointerup', e => readout.releasePointerCapture(e.pointerId));
});

// Start from the viewer's system theme
darkState.on = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
document.getElementById('darkToggle').checked = darkState.on;
setSlider('sat', darkState.sat);
setSlider('bright', darkState.bright);
applyDarkMode();

renderEntries();
</script>

</body></html>
